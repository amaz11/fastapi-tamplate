services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fastapi_db
      MYSQL_USER: fastapi
      MYSQL_PASSWORD: fastapi
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ufastapi", "-pfastapi"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: FastAPI Template
      SECRET_KEY: dev-only-change-me
      DATABASE_URL: mysql+pymysql://fastapi:fastapi@db:3306/fastapi_db
      LOG_LEVEL: INFO
      ENABLE_DEMO_MIDDLEWARE: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
